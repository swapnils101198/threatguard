<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f16"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="128" height="128" rx="28" ry="28" fill="url(#bg)"/>

  <!-- Shield outline -->
  <path d="M64 22 L100 36 V64 C100 88 84 102 64 108 C44 102 28 88 28 64 V36 Z"
        fill="url(#shield)" opacity="0.15"/>

  <!-- Shield border -->
  <path d="M64 22 L100 36 V64 C100 88 84 102 64 108 C44 102 28 88 28 64 V36 Z"
        fill="none" stroke="url(#shield)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Check mark inside shield -->
  <path d="M48 64 L58 74 L80 52"
        fill="none" stroke="#10b981" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>